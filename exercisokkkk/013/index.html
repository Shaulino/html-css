<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Para colocar video utilize a tag &lt;video&gt;. <br>Use parâmetro width para redimensionar o player no site e "poster" para add uma thumb</p>
    <p>Este vídeo está hospedado no meu própio servidor.</p>
    <video width="500" poster="img/thumbkkkj.png" controls>
        <source src="midia/mofi-KeV.webm" type="video/webm">
        <source src="midia/mofi.mp4" type="video/mp4">
    </video>

    <h1>Inserindo video importante</h1>
    <p>Vê o video ae:</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/uWbB2aNV3ic?si=EuNeJd0b1Kd34Vu_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
