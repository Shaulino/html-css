<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sex" id="imas" value="M">
            <label for="imas">Masculino</label>

            <input type="radio" name="sex" id="ifem" value="F">
            <label for="ifem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>

            <input type="checkbox" name="bas" id="ebas">
            <label for="ebas">Basquete</label> <br>

            <input type="checkbox" name="fut" id="efut"> 
            <label for="efut">Futebol</label> <br>

            <input type="checkbox" name="nat" id="enat"> 
            <label for="enat">Natação</label> <br>

            <input type="checkbox" name="Ten" id="eten"> 
            <label for="eten">Tênis</label> <br>
        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
