<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        div.container {
            background-color: cornflowerblue;
            display: flex;
            margin-bottom: 10px;
            height: 100px;
            width: 50%;
            padding: 10px;
            border: 1px solid black;
            border-radius: 15px;
            flex-flow: row nowrap;
            justify-content: center;
        }
 
        div.item {
            background-color: rgb(237, 100, 100);
            border: 1px solid black;
            flex: auto;
            border-radius: 25px;
            margin: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-basis: 150px;
            
        }

        div#ct2 {
            width: 70%;
        }

        div#ct3 {
            width: 40%;
        }

        div#itemA {
            flex: 0 1 150px;
        }

        div#itemB {
            flex: 0 1 150px;
        }

        div#itemC {
            flex: 0 1 150px;
        }


        div#itemD {
            flex: 0 1 150px;
        }
        
        div#itemE {
            flex: 2 0 150px;
        }

        div#itemF {
            flex: 1 1 150px;
        }

        div#itemG {
            flex: 0 1 150px;
        }

        div#itemH {
            flex: 0 1 150px;
        }

        div#itemI {
            flex: 0 2 150px;
        }
    </style>
</head>
<body>
    <main>
        <div class="container" id="ct1">
            <div class="item" id="itemA">A</div>
            <div class="item" id="itemB">B</div>
            <div class="item" id="itemC">C</div>
        </div>
        <div class="container" id="ct2">
            <div class="item" id="itemD">D</div>
            <div class="item" id="itemE">E</div>
            <div class="item" id="itemF">F</div>
        </div>
        <div class="container" id="ct3">
            <div class="item" id="itemG">G</div>
            <div class="item" id="itemH">H</div>
            <div class="item" id="itemI">I</div>
        </div>
    </main>
</body>
</html>
